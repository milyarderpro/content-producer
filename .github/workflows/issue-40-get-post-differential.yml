name: Issue 40 - focused get_post differential

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-40-get-post-differential.yml'
      - 'supabase/functions/mcp/get_post_differential_test.ts'
      - 'supabase/functions/mcp/post_base.ts'
      - 'supabase/functions/mcp/foundation.ts'
      - 'supabase/functions/mcp/get_post_diagnostic_test.ts'
      - 'supabase/migrations/20261022080000_preserve_get_post_source_snapshot_nulls.sql'
      - 'docs/decisions/2026-10-22-cr-049-get-post-source-evidence-null-preservation.md'
      - 'supabase/tests/database/api-source-evidence-mcp-compat.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-40-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-differential:
    name: Seven-fact SQL and real owner-JWT PostgREST HTTP differential
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up pinned Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version

      - name: Install and focused static checks
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            supabase/functions/mcp/post_base.ts \
            supabase/functions/mcp/foundation.ts \
            supabase/functions/mcp/get_post_diagnostic_test.ts \
            supabase/functions/mcp/get_post_differential_test.ts \
            supabase/tests/database/api-source-evidence-mcp-compat.test.ts
          pnpm exec prettier --write docs/decisions/2026-10-22-cr-049-get-post-source-evidence-null-preservation.md
          git diff -- supabase/functions/mcp/get_post_differential_test.ts docs/decisions/2026-10-22-cr-049-get-post-source-evidence-null-preservation.md
          pnpm run check
          pnpm run test:mcp

      - name: Isolated Supabase startup and one clean migration reset
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          pnpm exec supabase db reset --help >/dev/null
          pnpm run supabase:start > "$RUNNER_TEMP/issue-40-start.log" 2>&1
          if ! pnpm run supabase:reset > "$RUNNER_TEMP/issue-40-reset.log" 2>&1; then
            if grep -Fq 'UNEXPECTED_GET_POST_SOURCE_PROJECTION' "$RUNNER_TEMP/issue-40-reset.log"; then
              echo 'LOCAL_RESET_FAILURE_CLASS=GET_POST_MIGRATION_ANCHOR'
            elif grep -Eiq 'syntax error|unterminated|invalid input syntax' "$RUNNER_TEMP/issue-40-reset.log"; then
              echo 'LOCAL_RESET_FAILURE_CLASS=SQL_SYNTAX'
            else
              echo 'LOCAL_RESET_FAILURE_CLASS=OTHER_REDACTED'
            fi
            exit 1
          fi
          echo "Local-only stack started and migrations reset; no secrets or SQL logged."

      - name: Capture eight real SQL RPC projections and compare against MCP/Zod
        shell: bash
        run: |
          set -euo pipefail
          export GET_POST_DIFFERENTIAL_FILE="$RUNNER_TEMP/issue-40-sql-matrix.json"
          export GET_POST_HTTP_DIFFERENTIAL_FILE="$RUNNER_TEMP/issue-40-http-matrix.json"
          set +e
          pnpm exec vitest run --config vitest.database.config.ts \
            supabase/tests/database/api-source-evidence-mcp-compat.test.ts
          db_status=$?
          set -e
          test -s "$GET_POST_DIFFERENTIAL_FILE"
          test -s "$GET_POST_HTTP_DIFFERENTIAL_FILE"
          (cd supabase/functions && deno test \
            --allow-env=GET_POST_DIFFERENTIAL_FILE,GET_POST_HTTP_DIFFERENTIAL_FILE \
            --allow-read="$GET_POST_DIFFERENTIAL_FILE,$GET_POST_HTTP_DIFFERENTIAL_FILE" \
            mcp/get_post_differential_test.ts)
          (cd supabase/functions && deno test \
            --allow-env=MCP_GET_POST_DIAGNOSTICS \
            mcp/get_post_diagnostic_test.ts)
          test "$db_status" -eq 0

      - name: Note evidence boundary
        if: always()
        run: |
          echo 'Real owner-JWT PostgREST HTTP and SQL run on disposable local Supabase; only adapter replay uses simulated HTTP.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only sanitized local HTTP status, byte counts and Zod issue paths are reported; no token/raw payload is logged.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This focused run does not replace a >10-minute CR-020/044 full technical gate.' >> "$GITHUB_STEP_SUMMARY"
