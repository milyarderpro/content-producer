name: Phase 10.4 - temporary focused catalog gate

on:
  push:
    branches: [codex/phase-10-plugin]
    paths:
      - .github/workflows/phase-10-4-catalog-smoke.yml

permissions:
  contents: read

jobs:
  catalog:
    if: github.ref == 'refs/heads/codex/phase-10-plugin'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify only approved branch and parent
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/phase-10-plugin"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Start ephemeral Supabase
        run: |
          set -euo pipefail
          pnpm run supabase:start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - name: Clean local migration reset
        run: |
          set -euo pipefail
          pnpm run supabase:reset > "$RUNNER_TEMP/supabase-reset.log" 2>&1
      - name: Verify all migrations and read-only catalog security audit
        run: |
          set -euo pipefail
          pnpm run supabase:verify
          pnpm exec tsx scripts/phase-6-catalog-audit.ts
      - name: Check whitespace
        run: git diff --check
