name: Phase 9 - source and deployment preflight (light only)

on:
  push:
    branches: [codex/phase-9-deployment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Locked install, project check, CLI help, commit diff (no local DB)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Project check (includes frontend typecheck, build, focused tests)
        run: pnpm run check
      - name: Confirm pinned Supabase CLI commands without using a project
        run: |
          set -euo pipefail
          test "$(pnpm exec supabase --version)" = 2.120.0
          pnpm exec supabase db reset --help > /dev/null
          pnpm exec supabase db push --help > /dev/null
          pnpm exec supabase migration list --help > /dev/null
          pnpm exec supabase db lint --help > /dev/null
          pnpm exec supabase db dump --help > /dev/null
          pnpm exec supabase functions deploy --help > /dev/null
          echo "Pinned CLI 2.120.0 and help checks: exit 0"
      - name: Diff whitespace
        run: git diff --check "$(git merge-base HEAD origin/main)" HEAD
