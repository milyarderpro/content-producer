name: Phase 9.5 - bounded OAuth test callback (focused)

on:
  pull_request:
    branches: [main]
    paths:
      - 'auth-frontend/api/phase-9-5/**'
      - 'auth-frontend/tests/phase95.test.mjs'
      - 'auth-frontend/src/app.js'
      - 'auth-frontend/src/index.html'
      - 'auth-frontend/vercel.json'
      - '.github/workflows/phase-9-5-callback-ci.yml'

permissions:
  contents: read

jobs:
  callback-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact Prettier output for touched sources
        run: |
          pnpm exec prettier --write auth-frontend/api/phase-9-5/*.js auth-frontend/tests/phase95.test.mjs auth-frontend/src/app.js auth-frontend/src/index.html auth-frontend/vercel.json
          git diff -- auth-frontend/api/phase-9-5/ auth-frontend/tests/phase95.test.mjs auth-frontend/src/app.js auth-frontend/src/index.html auth-frontend/vercel.json
          git diff --exit-code -- auth-frontend/api/phase-9-5/ auth-frontend/tests/phase95.test.mjs auth-frontend/src/app.js auth-frontend/src/index.html auth-frontend/vercel.json
      - name: Focused Phase 9.5 callback tests
        run: node --test --test-concurrency=1 auth-frontend/tests/phase95.test.mjs
      - name: Project source checks
        run: pnpm run check
      - name: PR whitespace check
        run: git diff --check "$(git merge-base HEAD origin/main)" HEAD
