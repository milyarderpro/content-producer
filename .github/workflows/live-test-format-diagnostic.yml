name: Temporary - Live Test Markdown formatting diagnostic

on:
  push:
    branches: [docs/live-test-fix-workflow]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatted-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Output formatted markdown for documentation-only repair
        shell: bash
        run: |
          pnpm exec prettier --write docs/live-test/README.md docs/live-test/test-matrix.md docs/live-test/results.md
          for f in docs/live-test/README.md docs/live-test/test-matrix.md docs/live-test/results.md; do
            printf 'FORMAT_DATA|%s|%s\n' "$f" "$(base64 -w0 "$f")"
          done
