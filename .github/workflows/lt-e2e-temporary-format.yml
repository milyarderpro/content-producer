name: Temporary - E2E evidence formatting
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier formatted matrix
        shell: bash
        run: |
          pnpm exec prettier --write docs/live-test/test-matrix.md
          printf 'FORMATTED_MATRIX_BASE64|%s\n' "$(base64 -w0 docs/live-test/test-matrix.md)"
