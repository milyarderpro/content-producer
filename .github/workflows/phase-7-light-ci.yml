name: Phase 7 - final source and package gate

on:
  push:
    branches: [codex/phase-7-plugin]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-7-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-gate:
    name: Locked install, clean local Supabase, test-all, candidate verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact Phase 7 SHA and main merge-base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up pinned Deno for MCP suite
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version

      - name: Record SHA and local toolchain
        id: runtime
        run: |
          echo "SHA: $(git rev-parse HEAD)"
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Deno: $(deno --version | head -1)"
          echo "Docker: $(docker info --format '{{.ServerVersion}}')"
          test "$(pnpm --version)" = "10.33.2"

      - name: Install locked dependencies
        id: install
        run: |
          pnpm install --frozen-lockfile
          echo "Exit code: 0 (pnpm install --frozen-lockfile)"

      - name: Verify pinned Supabase CLI and reset command
        id: cli
        run: |
          pnpm exec supabase db reset --help >/dev/null
          pnpm exec supabase start --help >/dev/null
          test "$(pnpm exec supabase --version)" = "2.120.0"
          echo "Supabase CLI: 2.120.0 (pinned, reset/start help verified)"

      - name: Start local Supabase with Docker
        id: start
        shell: bash
        run: |
          set +e
          started=$SECONDS
          pnpm run supabase:start > "$RUNNER_TEMP/phase-7-local-start.log" 2>&1
          code=$?
          echo "pnpm run supabase:start: exit code $code; elapsed $((SECONDS - started))s"
          echo "Local generated credentials intentionally suppressed from CI logs."
          exit "$code"

      - name: Clean local migration reset
        id: reset
        shell: bash
        run: |
          set +e
          started=$SECONDS
          pnpm run supabase:reset > "$RUNNER_TEMP/phase-7-local-reset.log" 2>&1
          code=$?
          echo "pnpm run supabase:reset: exit code $code; elapsed $((SECONDS - started))s"
          echo "Migration SQL count: $(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          exit "$code"

      - name: Full test-all once (includes check, migrations, MCP and database)
        id: full
        run: |
          pnpm run test-all
          echo "Exit code: 0 (pnpm run test-all, includes project check and DB tests)"

      - name: Build validated candidate locally
        id: package
        run: |
          pnpm run package-plugin
          echo "Exit code: 0 (pnpm run package-plugin)"

      - name: Inspect actual candidate and verify allowlist plus SHA-256 evidence
        id: verify
        run: |
          pnpm exec tsx scripts/verify-plugin-candidate.ts
          cat artifacts/plugin-candidate-filelist.json
          echo "Exit code: 0 (generated candidate validated, exactly twelve files)"
          echo "No plugin package is uploaded, installed, deployed or published."

      - name: Check committed diff for whitespace problems
        id: diff
        run: |
          base="$(git merge-base HEAD origin/main)"
          echo "Merge-base: $base"
          git diff --check "$base" HEAD
          echo "Exit code: 0 (git diff --check)"

      - name: Write non-sensitive gate outcome summary
        if: always()
        env:
          RUNTIME: ${{ steps.runtime.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          CLI: ${{ steps.cli.outcome }}
          START: ${{ steps.start.outcome }}
          RESET: ${{ steps.reset.outcome }}
          FULL: ${{ steps.full.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          DIFF: ${{ steps.diff.outcome }}
        shell: bash
        run: |
          {
            echo "## Phase 7.4 candidate gate"
            echo
            echo "- SHA: $(git rev-parse HEAD)"
            echo "- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Local Supabase only; no remote credentials, host install, package upload or deployment"
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| Pinned toolchain/Docker | $RUNTIME |"
            echo "| Frozen pnpm install | $INSTALL |"
            echo "| Pinned Supabase CLI/help | $CLI |"
            echo "| Local Supabase start | $START |"
            echo "| Clean migration reset | $RESET |"
            echo "| Full test-all | $FULL |"
            echo "| Candidate generation | $PACKAGE |"
            echo "| Candidate allowlist/hash check | $VERIFY |"
            echo "| Committed diff check | $DIFF |"
            if test -f artifacts/plugin-candidate-filelist.json; then
              echo
              echo "Candidate manifest SHA-256: $(sha256sum artifacts/plugin-candidate-filelist.json | cut -d' ' -f1)"
              echo "Candidate file count: $(find artifacts/plugin-candidate -type f | wc -l)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local Supabase containers
        if: always()
        run: pnpm run supabase:stop > "$RUNNER_TEMP/phase-7-local-stop.log" 2>&1 || true
