name: Phase 10.4 - one-shot exact test formatting

on:
  push:
    branches: [codex/phase-10-plugin]
    paths:
      - '.github/phase-10-4-test-format-trigger.txt'

permissions:
  contents: write

jobs:
  format-test:
    if: github.ref == 'refs/heads/codex/phase-10-plugin'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Format changed regression test then drop privilege
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write supabase/functions/mcp/pilot_db_test.ts
          pnpm exec prettier --check supabase/functions/mcp/pilot_db_test.ts
          git diff --check
          git add -- supabase/functions/mcp/pilot_db_test.ts
          if ! git diff --cached --quiet; then
            git -c user.name='phase-10-ci[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Phase 10.4: format dedup test with pinned Prettier'
            git push origin HEAD:refs/heads/codex/phase-10-plugin
          fi
