name: Phase 10.1 - v11 portable hosted schemas verification
on:
  push:
    branches: [codex/phase-10-plugin]
    paths:
      - '.github/workflows/phase-10-1-v11-schema-verify.yml'
permissions:
  contents: read
jobs:
  read-only:
    name: External hosted read-only initialize and tools/list
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify all hosted tool schemas without any tools/call
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,collections
          url='https://xjonnilnypchtxogtopb.supabase.co/functions/v1/mcp'
          def invoke(method,ident,params=None):
              payload={'jsonrpc':'2.0','id':ident,'method':method}
              if params is not None: payload['params']=params
              request=urllib.request.Request(
                  url,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',
                  headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream',
                           'MCP-Protocol-Version':'2025-06-18','User-Agent':'phase10-v11-portable-schema-check/1.0'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  raw=response.read(1048576)
                  assert response.status==200
                  if 'text/event-stream' in response.headers.get('content-type',''):
                      records=[json.loads(line[6:]) for line in raw.decode().splitlines() if line.startswith('data: ')]
                      assert len(records)==1
                      result=records[0]
                  else: result=json.loads(raw)
                  print('HTTP',method,response.status,'bytes',len(raw),'error',result.get('error'))
                  return raw,result
          _,hello=invoke('initialize',1,{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'hosted-portable-schema-check','version':'1.0'}})
          assert hello.get('result',{}).get('protocolVersion')=='2025-06-18'
          raw,result=invoke('tools/list',2)
          tools=(result.get('result') or {}).get('tools',[])
          assert len(tools)==33 and len(set(t['name'] for t in tools))==33
          assert any(t['name']=='create_page' for t in tools)
          assert len(raw)<100000, 'CR-033 hosted catalog size budget'
          regex_count=0; nonportable=[]; rewrites=[]
          def walk(obj,path=''):
              if isinstance(obj,dict):
                  for key,val in obj.items():
                      if key=='pattern' and isinstance(val,str):
                          yield path+'/pattern',val
                      else: yield from walk(val,path+'/'+str(key))
              elif isinstance(obj,list):
                  for i,val in enumerate(obj):yield from walk(val,path+'/'+str(i))
          for tool in tools:
              assert tool.get('securitySchemes')==[{'type':'noauth'}]
              assert (tool.get('_meta') or {}).get('securitySchemes')==[{'type':'noauth'}]
              assert 'outputSchema' not in tool
              assert isinstance(tool.get('inputSchema'),dict) and tool['inputSchema'].get('type')=='object'
              for path,pat in walk(tool['inputSchema']):
                  regex_count+=1
                  if '\\p{' in pat: nonportable.append((tool['name'],path))
                  re.compile(pat)
                  if '\\x00-\\x1F\\x7F-\\x9F' in pat:rewrites.append((tool['name'],path))
          expected={('mark_post_posted','/properties/platform_post_id/anyOf/0/pattern'),
                    ('mark_post_posted','/properties/published_url/anyOf/0/pattern'),
                    ('record_post_performance','/properties/source/properties/note/anyOf/0/pattern')}
          print('TOOLS',len(tools),'UNIQUE',len(set(t['name'] for t in tools)),'CREATE_PAGE',True,'REGEX',regex_count,'PORTABLE_REWRITES',json.dumps(rewrites),'NONPORTABLE',nonportable,'SIZE',len(raw))
          assert set(rewrites)==expected, 'wrong replacement paths'
          assert len(rewrites)==3 and not nonportable
          print('PASS v11 real hosted: 33 tool schemas, exactly 3 valid equivalent Cc control regex replacements, no nonportable patterns, noauth, size below 100KB; no tools/call or business write')
          PY
