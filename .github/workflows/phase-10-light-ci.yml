name: Phase 10 - lightweight final package and artifact

on:
  push:
    branches: [codex/phase-10-plugin]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-10-light-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Locked install, affected checks, verified final ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit and main for diff
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Record SHA and classify changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/main)"
          echo "HEAD $(git rev-parse HEAD); base $base"
          git diff --check "$base" HEAD
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD)
          printf 'Changed: %s\n' "${files[*]}"
          format=()
          need_check=false
          for file in "${files[@]}"; do
            case "$file" in
              *.md|*.json|*.yml|*.yaml|*.ts|*.tsx|*.js|*.mjs|*.cjs) format+=("$file") ;;
            esac
            case "$file" in
              *.ts|*.tsx|*.js|*.mjs|*.cjs|package.json|pnpm-lock.yaml|tsconfig.json|.github/workflows/*.yml|.github/workflows/*.yaml)
                need_check=true ;;
            esac
          done
          if [ "${#format[@]}" -gt 0 ]; then
            printf '%s\n' "${format[@]}" > "$RUNNER_TEMP/phase-10-formatted-paths"
          fi
          echo "need_check=$need_check" >> "$GITHUB_OUTPUT"

      - name: Locked dependency installation
        run: pnpm install --frozen-lockfile

      - name: Formatting check for changed text
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/phase-10-formatted-paths" ]; then
            mapfile -t paths < "$RUNNER_TEMP/phase-10-formatted-paths"
            pnpm exec prettier --check "${paths[@]}"
          else
            echo "No format-covered changed files"
          fi

      - name: Project check for TypeScript or configuration changes
        if: steps.changes.outputs.need_check == 'true'
        run: pnpm run check

      - name: Focused package tests and final source validation
        run: |
          set -euo pipefail
          pnpm exec vitest run tests/plugin-config.test.ts tests/plugin-package.test.ts tests/plugin-skill.test.ts tests/plugin-trivia.test.ts
          pnpm run package-plugin
          pnpm exec tsx scripts/verify-plugin-candidate.ts
          test "$(find artifacts/plugin-candidate -type f | wc -l)" -eq 13

      - name: Archive final package and verify extracted entries and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          (
            cd artifacts/plugin-candidate
            find . -type f -print | LC_ALL=C sort | zip -X -q "../content-producer-private-v0.2.0.zip" -@
          )
          archive=artifacts/content-producer-private-v0.2.0.zip
          test -s "$archive"
          unzip -t "$archive" >/dev/null
          # Info-ZIP normalizes input './mcp.json' to archive entry 'mcp.json'.
          # Inspect real archive paths and compare them to the strict 13-file index.
          entries="$RUNNER_TEMP/phase-10-final-zip-entries.txt"
          unzip -Z1 "$archive" | tee "$entries"
          test "$(wc -l < "$entries")" -eq 13
          test "$(grep -Fxc 'mcp.json' "$entries")" -eq 1
          diff -u <(LC_ALL=C sort "$entries") <(jq -r '.files[].path' artifacts/plugin-candidate-filelist.json | LC_ALL=C sort)
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          unzip -q "$archive" -d "$verify_dir"
          diff -u <(find "$verify_dir" -type f | sed "s|^$verify_dir/||" | LC_ALL=C sort) <(jq -r '.files[].path' artifacts/plugin-candidate-filelist.json | LC_ALL=C sort)
          while IFS=$'\t' read -r hash path; do
            test "$(sha256sum "$verify_dir/$path" | cut -d ' ' -f1)" = "$hash"
          done < <(jq -r '.files[] | [.sha256, .path] | @tsv' artifacts/plugin-candidate-filelist.json)
          if grep -REn -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sb_secret_|github_pat_|ghp_[[:alnum:]]{20}' "$verify_dir"; then
            echo "Credential material must not appear in plugin ZIP"
            exit 1
          fi
          {
            echo "## Phase 10.2 final package (owner installation pending)"
            echo "- Commit SHA: $(git rev-parse HEAD)"
            echo "- ZIP: content-producer-private-v0.2.0.zip (13 allowlisted files)"
            echo "- ZIP SHA-256: $(sha256sum "$archive" | cut -d ' ' -f1)"
            echo "- All 13 extracted files verified against artifact filelist SHA-256"
            echo "- No authentication / public endpoint, no OAuth fields"
            echo "- Owner Plugin Creator installation and fresh-chat skill + MCP proof pending. No business write."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final verified ZIP and SHA-256 filelist
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-final-plugin
          path: |
            artifacts/content-producer-private-v0.2.0.zip
            artifacts/plugin-candidate-filelist.json
          if-no-files-found: error
          retention-days: 14
