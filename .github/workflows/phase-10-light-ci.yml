name: Phase 10 - lightweight final package and artifact

on:
  push:
    branches: [codex/phase-10-plugin]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-10-light-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Locked install, affected checks, verified final ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit and main for diff
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Record SHA and classify changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ] && [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]] &&
            [ "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$EVENT_BEFORE"
          else
            base="$(git merge-base HEAD origin/main)"
          fi
          echo "HEAD $(git rev-parse HEAD); base $base"
          git diff --check "$base" HEAD
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD)
          printf 'Changed: %s\n' "${files[*]}"
          format=()
          need_check=false
          mcp_changed=false
          package_changed=false
          for file in "${files[@]}"; do
            case "$file" in
              *.md|*.json|*.yml|*.yaml|*.ts|*.tsx|*.js|*.mjs|*.cjs) format+=("$file") ;;
            esac
            case "$file" in
              *.ts|*.tsx|*.js|*.mjs|*.cjs|package.json|pnpm-lock.yaml|tsconfig.json|.github/workflows/*.yml|.github/workflows/*.yaml)
                need_check=true ;;
            esac
            case "$file" in
              supabase/functions/mcp/*|supabase/functions/batch_a_server.ts|supabase/functions/deno.json|scripts/phase-6-13.ts|package.json|pnpm-lock.yaml)
                mcp_changed=true ;;
            esac
            case "$file" in
              plugin/*|scripts/plugin-*.ts|scripts/package-plugin.ts|scripts/verify-plugin-candidate.ts|tests/plugin-*.test.ts|package.json|pnpm-lock.yaml)
                package_changed=true ;;
            esac
          done
          if [ "${#format[@]}" -gt 0 ]; then
            printf '%s\n' "${format[@]}" > "$RUNNER_TEMP/phase-10-formatted-paths"
          fi
          echo "need_check=$need_check" >> "$GITHUB_OUTPUT"
          echo "mcp_changed=$mcp_changed" >> "$GITHUB_OUTPUT"
          echo "package_changed=$package_changed" >> "$GITHUB_OUTPUT"

      - name: Locked dependency installation
        run: pnpm install --frozen-lockfile

      - name: TEMPORARY diagnosis of Prettier Markdown difference
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write docs/phase-10/manual-results.md
          git diff -- docs/phase-10/manual-results.md
          git checkout -- docs/phase-10/manual-results.md

      - name: Formatting check for changed text
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/phase-10-formatted-paths" ]; then
            mapfile -t paths < "$RUNNER_TEMP/phase-10-formatted-paths"
            pnpm exec prettier --check "${paths[@]}"
          else
            echo "No format-covered changed files"
          fi

      - name: Project check for TypeScript or configuration changes
        if: steps.changes.outputs.need_check == 'true'
        run: pnpm run check

      - name: Set up pinned Deno for focused MCP tests
        if: steps.changes.outputs.mcp_changed == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version

      - name: Focused MCP-only 33-tool OAuth schema and regression suite
        if: steps.changes.outputs.mcp_changed == 'true'
        run: pnpm run test:mcp

      - name: Focused package tests and final source validation
        if: steps.changes.outputs.package_changed == 'true'
        run: |
          set -euo pipefail
          pnpm exec vitest run tests/plugin-config.test.ts tests/plugin-package.test.ts tests/plugin-skill.test.ts tests/plugin-trivia.test.ts
          pnpm run package-plugin
          pnpm exec tsx scripts/verify-plugin-candidate.ts
          test "$(find artifacts/plugin-candidate -type f | wc -l)" -eq 13

      - name: Archive final package and verify extracted entries and SHA-256
        if: steps.changes.outputs.package_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd artifacts/plugin-candidate
            find . -type f -print | LC_ALL=C sort | zip -X -q "../content-producer-private-v0.2.2.zip" -@
          )
          archive=artifacts/content-producer-private-v0.2.2.zip
          test -s "$archive"
          unzip -t "$archive" >/dev/null
          # Info-ZIP normalizes './.app.json' to archive entry '.app.json'.
          # Inspect real archive paths and compare them to the strict 13-file index.
          entries="$RUNNER_TEMP/phase-10-final-zip-entries.txt"
          unzip -Z1 "$archive" | tee "$entries"
          test "$(wc -l < "$entries")" -eq 13
          test "$(grep -Fxc '.app.json' "$entries")" -eq 1
          if grep -Fxq 'mcp.json' "$entries" || grep -Fxq '.mcp.json' "$entries"; then
            echo "Bundled MCP configuration must not accompany the registered mcpku mapping"
            exit 1
          fi
          diff -u <(LC_ALL=C sort "$entries") <(jq -r '.files[].path' artifacts/plugin-candidate-filelist.json | LC_ALL=C sort)
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          unzip -q "$archive" -d "$verify_dir"
          diff -u <(find "$verify_dir" -type f | sed "s|^$verify_dir/||" | LC_ALL=C sort) <(jq -r '.files[].path' artifacts/plugin-candidate-filelist.json | LC_ALL=C sort)
          while IFS=$'\t' read -r hash path; do
            test "$(sha256sum "$verify_dir/$path" | cut -d ' ' -f1)" = "$hash"
          done < <(jq -r '.files[] | [.sha256, .path] | @tsv' artifacts/plugin-candidate-filelist.json)
          if grep -REn -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sb_secret_|github_pat_|ghp_[[:alnum:]]{20}' "$verify_dir"; then
            echo "Credential material must not appear in plugin ZIP"
            exit 1
          fi
          {
            echo "## Phase 10 private owner OAuth v0.2.2 package (plugin update pending)"
            echo "- Commit SHA: $(git rev-parse HEAD)"
            echo "- ZIP: content-producer-private-v0.2.2.zip (13 allowlisted files)"
            echo "- ZIP SHA-256: $(sha256sum "$archive" | cut -d ' ' -f1)"
            echo "- All 13 extracted files verified against artifact filelist SHA-256"
            echo "- Registered required owner OAuth mcpku2 app mapping; no bundled MCP or OAuth config"
            echo "- Owner Plugin Creator update and @Content Producer fresh-chat 33 tool / 3 read proof pending. No business write."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final verified ZIP and SHA-256 filelist
        if: steps.changes.outputs.package_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-final-plugin-oauth-v0.2.2
          path: |
            artifacts/content-producer-private-v0.2.2.zip
            artifacts/plugin-candidate-filelist.json
          if-no-files-found: error
          retention-days: 14
