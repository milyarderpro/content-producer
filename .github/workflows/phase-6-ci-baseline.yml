name: Phase 6 - checkpoint verification

on:
  push:
    branches: [codex/phase-6-mcp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-6-checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    name: Phase 6.2 targeted CI (0 MCP tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout checkpoint commit
        uses: actions/checkout@v4

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up project Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up pinned Deno for MCP tests
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version

      - name: Record environment and verify Docker
        id: runner
        shell: bash
        run: |
          echo "STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "Checkpoint SHA: $(git rev-parse HEAD)"
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Deno: $(deno --version | head -1)"
          echo "Docker: $(docker info --format '{{.ServerVersion}}')"
          test "$(pnpm --version)" = "10.33.2"

      - name: Install locked dependencies
        id: install
        run: |
          pnpm install --frozen-lockfile
          echo "Exit code: 0 (pnpm install --frozen-lockfile)"

      - name: Temporary formatting export for 6.2 source files
        run: |
          files=(scripts/phase-6-1-http-smoke.ts supabase/functions/mcp/auth_test.ts supabase/functions/mcp/auth.ts supabase/functions/mcp/http.ts supabase/functions/mcp/transport_test.ts)
          pnpm exec prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "FORMAT_BEGIN ${file}"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END ${file}"
          done

      - name: Required project check
        id: check
        run: |
          pnpm run check
          echo "Exit code: 0 (pnpm run check)"

      - name: Verify migration filenames
        id: migrations
        run: |
          pnpm run verify-migrations
          echo "Exit code: 0 (pnpm run verify-migrations)"

      - name: Verify pinned Supabase CLI
        id: cli
        run: |
          test "$(pnpm exec supabase --version)" = "2.120.0"
          echo "Supabase CLI: 2.120.0 (verified)"

      - name: Start local Supabase
        id: start
        shell: bash
        run: |
          set +e
          started=$SECONDS
          pnpm run supabase:start > "$RUNNER_TEMP/phase-6-supabase-start.log" 2>&1
          code=$?
          echo "pnpm run supabase:start: exit code $code; elapsed $((SECONDS - started))s"
          echo "Supabase credentials and local keys omitted from CI logs."
          exit "$code"

      - name: Clean local migration reset
        id: reset
        shell: bash
        run: |
          set +e
          started=$SECONDS
          pnpm run supabase:reset > "$RUNNER_TEMP/phase-6-supabase-reset.log" 2>&1
          code=$?
          echo "pnpm run supabase:reset: exit code $code; elapsed $((SECONDS - started))s"
          echo "Migration SQL count: $(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          exit "$code"

      - name: Checkpoint 6.2 - internal MCP tests
        id: mcp
        run: |
          pnpm run test:mcp
          echo "Exit code: 0 (pnpm run test:mcp)"

      - name: Checkpoint 6.2 - local HTTP fail-closed smoke
        id: http
        shell: bash
        run: |
          printf 'MCP_RESOURCE_URL=http://127.0.0.1:54321/functions/v1/mcp\nMCP_OWNER_USER_ID=11111111-1111-4111-8111-111111111111\n' > "$RUNNER_TEMP/phase-6-mcp-env"
          pnpm exec supabase functions serve mcp --no-verify-jwt --env-file "$RUNNER_TEMP/phase-6-mcp-env" > "$RUNNER_TEMP/phase-6-mcp-serve.log" 2>&1 &
          serve_pid=$!
          trap 'kill "$serve_pid" 2>/dev/null || true' EXIT
          pnpm exec tsx scripts/phase-6-1-http-smoke.ts
          echo "Exit code: 0 (local MCP HTTP smoke)"

      - name: Focused database regression - Phase 5 surface, metrics, rate limits
        id: regression
        shell: bash
        run: |
          started=$SECONDS
          pnpm exec vitest run --config vitest.database.config.ts \
            supabase/tests/database/baseline.test.ts \
            supabase/tests/database/api-phase-five-acceptance.test.ts \
            supabase/tests/database/api-metrics.test.ts \
            supabase/tests/database/api-metrics-concurrency.test.ts \
            supabase/tests/database/operation-ledger-and-rate-limit-buckets.test.ts
          code=$?
          echo "Focused Phase 5 regression: exit code $code; elapsed $((SECONDS - started))s"
          exit "$code"

      # Gate penuh (pnpm run test-all, smoke-test, supabase:verify, audits,
      # Inspector, git diff --check) is reserved for 6.6 and 6.13.

      - name: Record non-sensitive checkpoint evidence
        if: always()
        shell: bash
        env:
          RUNNER_OUTCOME: ${{ steps.runner.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          MIGRATIONS_OUTCOME: ${{ steps.migrations.outcome }}
          CLI_OUTCOME: ${{ steps.cli.outcome }}
          START_OUTCOME: ${{ steps.start.outcome }}
          RESET_OUTCOME: ${{ steps.reset.outcome }}
          MCP_OUTCOME: ${{ steps.mcp.outcome }}
          HTTP_OUTCOME: ${{ steps.http.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/phase-6-evidence"
          report="$RUNNER_TEMP/phase-6-evidence/checkpoint-6.2.md"
          {
            echo "# Phase 6.2 targeted checkpoint CI"
            echo
            echo "- Commit: `$(git rev-parse HEAD)`"
            echo "- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Started UTC: `${STARTED_UTC:-not recorded}`"
            echo "- Finished UTC: `$(date -u +%Y-%m-%dT%H:%M:%SZ)`"
            echo "- New tools: 0; cumulative tools: **0/33**"
            echo "- Local Supabase only, no remote project, secrets, or deployment"
            echo
            echo "| Stage | Actual command / scope | GitHub step outcome |"
            echo "|---|---|---|"
            echo "| Runtime/Docker | pinned versions, docker info | $RUNNER_OUTCOME |"
            echo '| Dependencies | `pnpm install --frozen-lockfile` | '"$INSTALL_OUTCOME"' |'
            echo '| Project check | `pnpm run check` | '"$CHECK_OUTCOME"' |'
            echo '| Migration filenames | `pnpm run verify-migrations` | '"$MIGRATIONS_OUTCOME"' |'
            echo "| Supabase CLI 2.120.0 | pinned version | $CLI_OUTCOME |"
            echo '| Local Docker | `pnpm run supabase:start` | '"$START_OUTCOME"' |'
            echo '| Clean reset | `pnpm run supabase:reset` | '"$RESET_OUTCOME"' |'
            echo '| Internal MCP | `pnpm run test:mcp` | '"$MCP_OUTCOME"' |'
            echo '| Black-box HTTP | `supabase functions serve mcp --no-verify-jwt` + HTTP smoke | '"$HTTP_OUTCOME"' |'
            echo '| Focused regression | Phase 5 catalog, metrics, concurrency, rate limits, baseline | '"$REGRESSION_OUTCOME"' |'
            echo
            echo "The complete batch gate is NOT run on checkpoint pushes; it is reserved for 6.6/6.13."
            echo "Numerical exit codes and exact assertions are in Actions step logs. A skipped stage is not a pass."
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-sensitive checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-2-ci-evidence
          path: ${{ runner.temp }}/phase-6-evidence/checkpoint-6.2.md
          if-no-files-found: error
          retention-days: 14
