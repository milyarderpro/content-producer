name: Phase 10.1 - focused portable MCP schema validation
on:
  push:
    branches: [codex/phase-10-plugin]
    paths:
      - '.github/workflows/phase-10-1-schema-diagnostics.yml'
permissions:
  contents: read
jobs:
  focused-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
      - name: Format and verify targeted CR-034 files
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write docs/decisions/2026-10-18-phase-10-1-portable-regex-catalog.md supabase/functions/mcp/transport.ts supabase/functions/mcp/pilot_db_test.ts
          pnpm exec prettier --check docs/decisions/2026-10-18-phase-10-1-portable-regex-catalog.md supabase/functions/mcp/transport.ts supabase/functions/mcp/pilot_db_test.ts
          pnpm run check
          (
            cd supabase/functions
            deno check mcp/index.ts mcp/pilot_db_test.ts
            deno lint mcp/transport.ts mcp/pilot_db_test.ts
            AI_AGENT=none APPVEYOR=1 deno test --allow-env=NODE_ENV,AI_AGENT,APPVEYOR,CI,DEBUG,TEST,MODE,MINIMAL,NO_COLOR,FORCE_COLOR,TERM mcp/pilot_db_test.ts
          )
          if git diff --quiet; then
            echo "Formatting already clean"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/decisions/2026-10-18-phase-10-1-portable-regex-catalog.md supabase/functions/mcp/transport.ts supabase/functions/mcp/pilot_db_test.ts
            git commit -m "style(phase-10.1): format CR-034 portable catalog patch"
            git push origin HEAD:codex/phase-10-plugin
          fi
