name: Phase 10.1 - anonymous MCP probe focused CI

on:
  push:
    branches: [codex/phase-10-plugin]
    paths:
      - 'supabase/functions/mcp-probe/**'
      - 'supabase/config.toml'
      - '.github/workflows/phase-10-1-probe-ci.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Anonymous initialize, one-tool list, and ping
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
      - name: Test only the isolated probe
        working-directory: supabase/functions
        run: |
          set -euo pipefail
          deno fmt --check mcp-probe
          deno lint mcp-probe
          deno check mcp-probe/index.ts mcp-probe/handler_test.ts
          deno test mcp-probe/handler_test.ts
