name: Phase 10 temporary formatting repair
on:
  push:
    branches: [codex/phase-10-plugin]
    paths: [.github/workflows/phase-10-format-helper.yml]
permissions:
  contents: read
jobs:
  prepare-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print trusted Prettier output for affected text paths
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            docs/decisions/2026-10-19-phase-10-3-man02-exact-write-latch.md
            docs/phase-10/manual-results.md
            supabase/functions/mcp/pilot_db_test.ts
          )
          pnpm exec prettier --write "${paths[@]}"
          for path in "${paths[@]}"; do
            printf '__PHASE10_FMT_BEGIN__%s\n' "$path"
            cat "$path"
            printf '\n__PHASE10_FMT_END__%s\n' "$path"
          done
