name: Phase 10.1 - read-only hosted MCP descriptor diagnostics
on:
  push:
    branches: [codex/phase-10-plugin]
    paths:
      - '.github/workflows/phase-10-1-hosted-catalog-diagnostics.yml'
      - 'supabase/functions/mcp/transport.ts'
      - 'supabase/functions/mcp/pilot_db_test.ts'
permissions:
  contents: read
jobs:
  format-cr033:
    name: Format CR-033 and pilot transport using pinned Prettier
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Format single decision record and commit only if required
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write docs/decisions/2026-10-18-phase-10-1-chatgpt-catalog-budget.md supabase/functions/mcp/transport.ts
          if git diff --quiet; then
            echo "CR-033 and transport already formatted"
            exit 0
          fi
          git diff --name-only | grep -Ev "^(docs/decisions/2026-10-18-phase-10-1-chatgpt-catalog-budget.md|supabase/functions/mcp/transport.ts)$" | grep . && exit 1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/decisions/2026-10-18-phase-10-1-chatgpt-catalog-budget.md supabase/functions/mcp/transport.ts
          git commit -m "style(phase-10.1): apply pinned Prettier to compact catalog metadata"
          git push origin HEAD:codex/phase-10-plugin
  catalog-focused:
    name: Local compact-catalog Deno checks (no remote writes)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
      - name: Focused format, type, lint, 33-tool descriptor and write-denial tests
        run: |
          set -euo pipefail
          deno check mcp/index.ts mcp/pilot_db_test.ts
          deno lint mcp/transport.ts mcp/pilot_db_test.ts
          AI_AGENT=none APPVEYOR=1 deno test --allow-env=NODE_ENV,AI_AGENT,APPVEYOR,CI,DEBUG,TEST,MODE,MINIMAL,NO_COLOR,FORCE_COLOR,TERM mcp/pilot_db_test.ts
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Run real production initialize and tools/list only (NO tools/call)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, collections
          url = "https://xjonnilnypchtxogtopb.supabase.co/functions/v1/mcp"
          def call(method, i, params=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps({"jsonrpc":"2.0","id":i,"method":method,**({"params":params} if params is not None else {})}).encode(),
                  headers={"content-type":"application/json","accept":"application/json, text/event-stream",
                           "mcp-protocol-version":"2025-06-18","user-agent":"phase-10-1-read-only-diagnostics/1.0"},
                  method="POST")
              with urllib.request.urlopen(req,timeout=45) as response:
                  body=response.read(2097152).decode()
                  print("HTTP",method,response.status,"type",response.headers.get("content-type"),"bytes",len(body))
                  if "text/event-stream" in response.headers.get("content-type",""):
                      records=[json.loads(line[6:]) for line in body.splitlines() if line.startswith("data: ")]
                      return records[-1]
                  return json.loads(body)
          init=call("initialize",1,{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"phase-10-1-host-readonly","version":"1.0"}})
          info=init.get("result") or {}
          print("INIT info:",json.dumps({"protocolVersion":info.get("protocolVersion"),"capabilities":info.get("capabilities"),"serverInfo":info.get("serverInfo"),"error":init.get("error")},ensure_ascii=False))
          body=call("tools/list",2)
          if "error" in body:
              print("ERROR",body["error"])
              raise SystemExit(1)
          tools=(body.get("result") or {}).get("tools",[])
          print("TOOLS count",len(tools),"unique",len(set(t.get("name","") for t in tools)))
          print("ALL names:",[t.get("name") for t in tools])
          for field in ["name","title","description","inputSchema","outputSchema","annotations","securitySchemes","_meta"]:
              total=sum(len(json.dumps(t.get(field),separators=(",",":"),ensure_ascii=False).encode()) for t in tools)
              print("BYTES BY FIELD",field,total)
          print("TOP 8 TOOLS BYTES:", sorted([(t.get("name"),len(json.dumps(t,separators=(",",":"),ensure_ascii=False).encode()),len(json.dumps(t.get("inputSchema"),separators=(",",":"),ensure_ascii=False).encode()),len(json.dumps(t.get("outputSchema"),separators=(",",":"),ensure_ascii=False).encode())) for t in tools],key=lambda x:-x[1])[:8])
          print("COMPACT FULL TOOLS BYTES",len(json.dumps(tools,separators=(",",":"),ensure_ascii=False).encode()))
          def compressed_schemas(tool, cap=None):
              out=dict(tool)
              out.pop("outputSchema",None)
              if cap is not None:
                  def transform(value):
                      if isinstance(value,dict):
                          return {k: (v[:cap] if k=="description" and isinstance(v,str) else transform(v)) for k,v in value.items()}
                      if isinstance(value,list):return [transform(v) for v in value]
                      return value
                  out["inputSchema"]=transform(out["inputSchema"])
              return out
          for cap in [None, 160, 100, 64, 32]:
              proposal=[compressed_schemas(t,cap) for t in tools]
              print("PROJECTED WITHOUT OUTPUTSCHEMA INPUTDESC CAP",cap,"BYTES",len(json.dumps(proposal,separators=(",",":"),ensure_ascii=False).encode()))
          print("TOPLEVEL keys:",dict(collections.Counter(str(k) for t in tools for k in t)))
          print("META keys:",dict(collections.Counter(str(k) for t in tools for k in (t.get("_meta") or {}))))
          print("ANNOTATIONS:",dict(collections.Counter(json.dumps(t.get("annotations"),sort_keys=True) for t in tools)))
          print("SCHEMES:",dict(collections.Counter(json.dumps(t.get("securitySchemes"),sort_keys=True) for t in tools)))
          anomalies=[]
          for t in tools:
              name=t.get("name")
              schema=t.get("inputSchema")
              if not isinstance(schema,dict) or schema.get("type")!="object": anomalies.append([name,"invalid input schema",str(schema)[:200]])
              for field in ["title","description"]:
                  if field in t and not isinstance(t[field],str): anomalies.append([name,"invalid "+field])
              for k,v in (schema.get("properties") or {}).items():
                  if not isinstance(v,dict): anomalies.append([name,"bad property schema",k])
              if t.get("outputSchema") is not None and t["outputSchema"].get("type")!="object": anomalies.append([name,"invalid output schema"])
              print("TOOL",name,"descLen",len(t.get("description") or ""),"inputKeys",list((schema or {}).keys()),"numProps",len((schema or {}).get("properties") or {}),"outKeys",list((t.get("outputSchema") or {}).keys()),"annotation",t.get("annotations"),"metaKeys",list((t.get("_meta") or {}).keys()))
          print("ANOMALIES",json.dumps(anomalies,ensure_ascii=False))
          assert len(tools)==33 and len(set(t["name"] for t in tools))==33
          assert all(t.get("securitySchemes")==[{"type":"noauth"}] for t in tools)
          assert all((t.get("_meta") or {}).get("securitySchemes")==[{"type":"noauth"}] for t in tools)
          assert not anomalies
          print("READ-ONLY HOSTED DESCRIPTORS PASS: 33 explicit noauth tool declarations; this alone does not prove ChatGPT plugin acceptance")
          PY
