name: Phase 10.4 - temporary production evidence formatting
on:
  push:
    branches: [codex/phase-10-plugin]
    paths:
      - .github/workflows/phase-10-4-production-doc-format.yml
permissions:
  contents: write
jobs:
  format-evidence:
    if: github.ref == 'refs/heads/codex/phase-10-plugin'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Guard exact parent and branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "b73f9ddf0cce688c324178bc27ffffe823359d6c"
          test "$GITHUB_REF" = "refs/heads/codex/phase-10-plugin"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Format only evidence Markdown and commit
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write docs/phase-10/manual-results.md
          pnpm exec prettier --check docs/phase-10/manual-results.md
          git diff --check
          git add -- docs/phase-10/manual-results.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(10.4): format release evidence Markdown"
            git push origin HEAD:refs/heads/codex/phase-10-plugin
          fi
