name: Phase 10.4 - one-shot Prettier correction

on:
  push:
    branches: [codex/phase-10-plugin]
    paths:
      - .github/workflows/phase-10-4-audit-format.yml

permissions:
  contents: write

jobs:
  format-audit:
    if: github.ref == 'refs/heads/codex/phase-10-plugin'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout frozen source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 2
      - name: Refuse unexpected source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "80904c3d071f9c5ca63b1c7e67ec9cd0ac289d09"
          test "$GITHUB_REF" = "refs/heads/codex/phase-10-plugin"
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Format only the two CR-046 audit files
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write             scripts/phase-6-catalog-audit.ts             docs/decisions/2026-10-20-phase-10-4-generation-context-config-id.md
          pnpm exec prettier --check             scripts/phase-6-catalog-audit.ts             docs/decisions/2026-10-20-phase-10-4-generation-context-config-id.md
          git diff --check
          git add -- scripts/phase-6-catalog-audit.ts             docs/decisions/2026-10-20-phase-10-4-generation-context-config-id.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(CR-046): apply pinned Prettier formatting to audit repair"
            git push origin HEAD:refs/heads/codex/phase-10-plugin
          fi
