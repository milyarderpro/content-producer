name: Phase 9.3 - temporary focused Phase 5 regression

# Temporary branch-only proof; remove this file before merging the fix PR.
on:
  push:
    branches: [codex/phase-9-3-frontend-acceptance-fix]

permissions:
  contents: read

jobs:
  phase-5-security-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start ephemeral local stack
        run: pnpm run supabase:start > "$RUNNER_TEMP/local-start.log" 2>&1
      - name: One local migration reset
        run: pnpm run supabase:reset > "$RUNNER_TEMP/local-reset.log" 2>&1
      - name: Focused SEC acceptance (RPC RLS ACL and real frontend presence)
        run: pnpm exec vitest run --config vitest.database.config.ts supabase/tests/database/api-phase-five-acceptance.test.ts -t 'SEC-'
      - name: Diff check
        run: git diff --check HEAD^ HEAD
