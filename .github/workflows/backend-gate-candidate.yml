name: Backend candidate - G3 exact SHA (manual only)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact main commit SHA to evaluate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Candidate source at exact SHA
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
      - name: Verify exact dispatch identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Source gate
        shell: bash
        env:
          GATE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GATE_EVIDENCE_FILE: ${{ runner.temp }}/source/report.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$GATE_EVIDENCE_FILE")"
          pnpm install --frozen-lockfile >/dev/null
          pnpm run gate:source >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-source-${{ github.sha }}
          path: ${{ runner.temp }}/source/report.json
          if-no-files-found: error
          retention-days: 14

  database:
    name: Candidate DB shard ${{ matrix.shard }} exact SHA
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2']
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact dispatch, config, and vacant stack
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git show HEAD:supabase/config.toml | cmp -s - supabase/config.toml
          test ! -e supabase/.temp/project-ref
          test ! -e .supabase/project-ref
          test -z "$(docker ps -a --format '{{.Names}}' | grep -E '^supabase_' || true)"
          test -z "$(docker network ls --format '{{.Name}}' | grep -E '^supabase_network_' || true)"
          test -z "$(docker volume ls --format '{{.Name}}' | grep -E '^supabase_' || true)"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
      - name: Run isolated Supabase stack, reset, fixtures and serial shard
        shell: bash
        env:
          GATE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GATE_ACTIONS_EXACT_CONFIG: '1'
          GATE_CONFIG_MODE: ACTIONS_EXACT_CONFIG
          GATE_DB_SHARD: ${{ matrix.shard }}
          GATE_EVIDENCE_FILE: ${{ runner.temp }}/database/report.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$GATE_EVIDENCE_FILE")"
          pnpm install --frozen-lockfile >/dev/null
          pnpm run gate:backend >/dev/null
      - name: Upload safe shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-db-shard-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/database/report.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Candidate evidence conjunction (not release check)
    needs: [source, database]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify both jobs succeeded before evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOURCE_JOB: ${{ needs.source.result }}
          DATABASE_JOB: ${{ needs.database.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_JOB" = success
          test "$DATABASE_JOB" = success
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-source-${{ github.sha }}
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@v4
        with:
          name: candidate-db-shard-1-${{ github.sha }}
          path: ${{ runner.temp }}/one
      - uses: actions/download-artifact@v4
        with:
          name: candidate-db-shard-2-${{ github.sha }}
          path: ${{ runner.temp }}/two
      - name: Fail closed on identity, missing or duplicate files, skipped cases and stages
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile >/dev/null
          pnpm exec tsx scripts/gate-backend.ts --aggregate \
            "$RUNNER_TEMP/source/report.json" \
            "$RUNNER_TEMP/one/report.json" \
            "$RUNNER_TEMP/two/report.json" "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidate only; no cutover, release or hosted OAuth claim.' >> "$GITHUB_STEP_SUMMARY"
